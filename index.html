<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="google-adsense-account" content="ca-pub-4869006740630468">
<title>Ace Paste Cleaner Pro</title><link rel="stylesheet" href="/styles.css">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4869006740630468" crossorigin="anonymous"></script>
</head><body>
<header class="hdr"><img src="/brand.jpg" class="logo" alt="Ace"><h1>Ace Paste Cleaner Pro</h1><span class="domain">acepaste.xyz</span><button id="darkModeToggle" class="dark-toggle" aria-label="Toggle dark mode">🌙</button></header>
<main class="wrap">
  <img src="/brand.jpg" class="hero" alt="Ace Logo">
  <label class="lbl">Paste text</label>
  <textarea id="paste" class="ta" rows="8" placeholder="Paste here…"></textarea>
  
  <div class="options-panel">
    <div class="options-top">
      <label><input type="checkbox" id="removeMarkdown" checked> Remove markdown</label>
      <label><input type="checkbox" id="removeAIMarkup" checked> Remove AI debris (##, ***, +++)</label>
      <label><input type="checkbox" id="privacyMode"> Privacy Mode (client-side only)</label>
    </div>
    
    <button id="moreOptions" class="btn-ghost">Advanced options ▾</button>
    <div id="advanced" class="advanced hidden">
      <div class="option-group">
        <div class="group-title">Invisible / Junk</div>
        <label><input type="checkbox" id="collapseSpaces" checked> Collapse extra spaces</label>
        <label><input type="checkbox" id="collapseNewlines" checked> Collapse 3+ newlines</label>
        <label><input type="checkbox" id="trimPerLine" checked> Trim per line</label>
        <label><input type="checkbox" id="removeHtml"> Remove HTML tags</label>
      </div>
      
      <div class="option-group">
        <div class="group-title">Code / AI Cleanup</div>
        <label><input type="checkbox" id="removeComments" checked> Remove comments (#, //, /* */, <!-- -->)</label>
      </div>
      
      <div class="option-group">
        <div class="group-title">Case Transform</div>
        <div class="case-options">
          <label><input type="radio" name="caseTx" value="" checked> None</label>
          <label><input type="radio" name="caseTx" value="upper"> UPPERCASE</label>
          <label><input type="radio" name="caseTx" value="lower"> lowercase</label>
          <label><input type="radio" name="caseTx" value="capitalize"> Capitalize Each Word</label>
          <label><input type="radio" name="caseTx" value="title"> Title Case</label>
        </div>
      </div>
      
      <div class="option-group">
        <div class="group-title">Custom Find/Replace</div>
        <input id="customFind" class="input-small" placeholder="Find text or /regex/">
        <input id="customReplace" class="input-small" placeholder="Replace with (empty to remove)">
        <label><input type="checkbox" id="customRegex"> Use regex</label>
      </div>
    </div>
  </div>
  
  <div class="button-group">
    <button id="pasteBtn" class="btn-secondary">Paste</button>
    <button id="cleanBtn" class="btn">Clean my paste</button>
    <button id="clearBtn" class="btn-secondary">Clear</button>
  </div>
  <label class="lbl">Cleaned output</label>
  <textarea id="cleaned" class="ta" rows="8" placeholder="Cleaned output…" readonly></textarea>
</main>
<footer class="footer">
  <small>
    <a href="/privacy.html">Privacy Policy</a> | 
    <a href="/privacy-eu.html">EU Privacy Policy</a> | 
    <a href="/security.html">Security & Terms</a> | 
    © 2025 Ace Paste Cleaner Pro. Client-side processing. No data stored.
  </small>
</footer>
<script src="/app.js"></script>
</body></html>
