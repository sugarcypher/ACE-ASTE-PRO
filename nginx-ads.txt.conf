# Nginx configuration for ads.txt handling
# Add this to your nginx server block configuration
# 
# For GitHub Pages: This won't work - use Cloudflare Worker instead
# For self-hosted/VPS: Add this to your nginx site configuration

location = /ads.txt {
    proxy_pass https://srv.adstxtmanager.com/81161/acepaste.xyz;
    proxy_set_header Host srv.adstxtmanager.com;

    # If upstream fails (502, 503, 504), serve fallback
    error_page 502 503 504 = @ads_fallback;
}

location @ads_fallback {
    default_type text/plain;
    alias /var/www/ads-fallback.txt;
}

