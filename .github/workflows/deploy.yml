name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      # upload-pages-artifact has no exclude-paths input; it silently ignored the
      # old list and deployed every file. Delete non-site files from the runner's
      # checkout before upload instead. .well-known/ must stay (security.txt);
      # upload-pages-artifact@v4 drops dot-folders, so stay on v3 or handle that first.
      - name: Remove files that are not part of the site
        run: |
          rm -rf public test node_modules .claude supabase AcePasteBrowserExtension ace-paste-extension.zip indeBADx.html _headers _redirects ads-fallback.txt
          find . -path ./.git -prune -o -path ./.github -prune -o -path ./.well-known -prune -o -type f \( \
            -name '*.md' -o -name '*.sh' -o -name '*.conf' -o -name '*.php' \
            -o -name '.gitignore' -o -name '.htaccess' -o -name '.fuse_hidden*' \
            -o -name 'cloudflare-worker-*.js' \
          \) -exec rm -f {} +

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

